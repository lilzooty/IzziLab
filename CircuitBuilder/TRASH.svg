<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="ds">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#111111" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="45%" stop-color="#b0b8c0"/>
      <stop offset="100%" stop-color="#707880"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="45%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Lid handle -->
  <rect x="26" y="6" width="12" height="5" rx="2.5"
    fill="url(#lidGrad)" stroke="#606870" stroke-width="1" filter="url(#ds)"/>
  <rect x="27" y="6.5" width="10" height="2" rx="1" fill="white" opacity="0.6"/>

  <!-- Lid -->
  <rect x="12" y="11" width="40" height="7" rx="3.5"
    fill="url(#lidGrad)" stroke="#606870" stroke-width="1.2" filter="url(#ds)"/>
  <rect x="13" y="12" width="38" height="3" rx="2" fill="url(#gloss)" opacity="0.85"/>

  <!-- Trash body -->
  <path d="M16,20 L18,56 Q18,58 20,58 L44,58 Q46,58 46,56 L48,20 Z"
    fill="url(#bodyGrad)" stroke="#606870" stroke-width="1.2" filter="url(#ds)"/>
  <path d="M17,20 L18.5,38 Q22,34 28,34 L28,20 Z"
    fill="url(#gloss)" opacity="0.6"/>

  <!-- Lines on body -->
  <line x1="26" y1="24" x2="25" y2="54" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="24" x2="32" y2="54" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="38" y1="24" x2="39" y2="54" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
