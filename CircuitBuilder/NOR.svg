<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="ds">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000044" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b0"/>
      <stop offset="48%" stop-color="#f08828"/>
      <stop offset="100%" stop-color="#a03800"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="bub" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f08828" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <line x1="2" y1="22" x2="14" y2="22" stroke="#ffcc88" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="42" x2="14" y2="42" stroke="#ffcc88" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="62" y2="32" stroke="#ffcc88" stroke-width="2" stroke-linecap="round"/>

  <path d="M12,52 Q28,52 48,32 Q28,12 12,12 Q19,22 19,32 Q19,42 12,52 Z"
    fill="url(#bg)" stroke="#a03800" stroke-width="1.4" filter="url(#ds)"/>
  <path d="M12,12 Q28,12 48,32 Q36,22 19,18 Q16,14 12,12 Z"
    fill="url(#gloss)" opacity="0.7"/>
  <!-- bubble -->
  <circle cx="52" cy="32" r="4.2" fill="url(#bub)" stroke="#ffcc88" stroke-width="0.9"/>
  <ellipse cx="50.5" cy="30.5" rx="1.6" ry="1.0" fill="white" opacity="0.9"/>
</svg>
