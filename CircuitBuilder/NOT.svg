<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0077bb" flood-opacity="0.35"/>
    </filter>
    <!-- Gate body gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8f0ff"/>
      <stop offset="40%" stop-color="#5bc8f5"/>
      <stop offset="100%" stop-color="#1a8ccf"/>
    </linearGradient>
    <!-- Gloss overlay -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Inner glow rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#66ccff" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="bodyGradNot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c8ff"/>
      <stop offset="40%" stop-color="#a06cf5"/>
      <stop offset="100%" stop-color="#5522cc"/>
    </linearGradient>

  </defs>

  <!-- Soft ambient glow behind gate -->
  <ellipse cx="32" cy="34" rx="24" ry="18" fill="#44bbff" opacity="0.18" filter="url(#dropShadow)"/>

  <!-- Gate body fill -->
  
  <path d="M12,14 L48,32 L12,50 Z"
    fill="url(#bodyGradNot)" filter="url(#dropShadow)" stroke="#9b7ff5" stroke-width="1.2"/>
  <path d="M13,15 L42,28 L42,30 L13,22 Z"
    fill="url(#glossGrad)" opacity="0.8"/>
  <path d="M12,14 L48,32 L12,50 Z"
    fill="none" stroke="url(#rimGrad)" stroke-width="1.5"/>


  
        <!-- Negation bubble - glassy -->
        <defs>
          <radialGradient id="bubGrad" cx="40%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#a8e6ff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#3ab8f0" stop-opacity="0.9"/>
          </radialGradient>
        </defs>
        <circle cx="52" cy="32" r="4.5"
          fill="url(#bubGrad)"
          stroke="#5dd4f7" stroke-width="1"
          filter="url(#dropShadow)"/>
        <!-- bubble gloss -->
        <ellipse cx="51" cy="30" rx="2" ry="1.2" fill="white" opacity="0.8"/>
        

  <!-- Input/output connector lines -->
  
        <line x1="2" y1="32" x2="12" y2="32" stroke="#7dd4f5" stroke-width="2" stroke-linecap="round"/>
        
  <line x1="56.5" y1="32" x2="62" y2="32" stroke="#7dd4f5" stroke-width="2" stroke-linecap="round"/>
</svg>